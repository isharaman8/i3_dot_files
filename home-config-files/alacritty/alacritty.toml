# fonts config
[font]
size = 8.0

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.bold_italic]
family = "JetBrainsMono Nerd Font"
style = "Bold Italic"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"



# keyboard bindings

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"


[colors.primary]
background = "#0b0b0c"     # nearly-black to match starry background
foreground = "#e8e3cf"     # soft parchment, slightly warm

[colors.normal]
black   = "#0d0d0d"
red     = "#c85a5f"        # muted/maple red
green   = "#6b8a78"        # desaturated pine green
yellow  = "#c39b49"        # warm ginkgo gold
blue    = "#3b5b86"        # cloudy sky, darker
magenta = "#8f5960"        # plum, muted
cyan    = "#6b8f8b"        # koi pond teal, muted
white   = "#cfc9b7"        # softer white for normal text

[colors.bright]
black   = "#2b2b2b"
red     = "#e06f74"
green   = "#8fb18f"
yellow  = "#ffcf7f"
blue    = "#74a1d9"
magenta = "#c99bb0"
cyan    = "#8fd6df"
white   = "#ffffff"

