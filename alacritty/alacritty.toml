# fonts config

[font]
size = 11.0

[font.bold]
family = "hack"
style = "Bold"

[font.bold_italic]
family = "monospace"
style = "Bold Italic"
[font.italic]
family = "hack"
style = "Italic"

[font.normal]
family = "hack"
style = "Regular"



# keyboard bindings

[[keyboard.bindings]]
action = "ToggleFullscreen"
key = "F11"


[colors.primary]
background = "#1f1f1f"     # Deep neutral black
foreground = "#e9e3d0"     # Soft parchment white

[colors.normal]
black   = "#1c1c1c"
red     = "#e05f65"        # Maple leaf red
green   = "#7d9d83"        # Faded pine green
yellow  = "#d6a657"        # Ginkgo gold
blue    = "#4f6fa1"        # Cloudy sky blue
magenta = "#a4707a"        # Plum blossom pink
cyan    = "#7fa5a3"        # Koi pond teal
white   = "#dcd6c4"

[colors.bright]
black   = "#3a3a3a"
red     = "#f07178"
green   = "#98c379"
yellow  = "#ffcb6b"
blue    = "#82aaff"
magenta = "#d291bc"
cyan    = "#89ddff"
white   = "#ffffff"

# window (opacity, scrolling etc)

[window]
opacity = 0.8

[scrolling]
history = 50000

